<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>News Board</title>
<link rel="icon" type="image/png" href="https://sandip617.github.io/news-board/icons/favicon.png?v=2">
<link rel="apple-touch-icon" href="https://sandip617.github.io/news-board/icons/apple-touch-icon.png?v=2">
<meta property="og:title" content="Sandip's Board">
<meta property="og:image" content="https://sandip617.github.io/news-board/icons/og.png">

<script>if (location.hostname === "sandip617.github.io" && !/[?&]stay\b/.test(location.search)) location.replace("https://itzsandippal.com/newsboard/" + location.hash);</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Noto+Serif+Bengali:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a broadsheet front page. Masthead, market strip, lead story + side column, then blog, quiz/case, notes, archive. */
:root {
  --paper: #f5f1e8;
  --paper-2: #ece6d9;
  --ink: #1b1814;
  --ink-2: #5a5247;
  --hair: #cbc1af;
  --red: #b0241c;
  --up: #22683b;
  --down: #b0241c;
  --sel: #f2d9a6;
  --f-mast: "Tiro Bangla", "Noto Serif Bengali", Georgia, serif;
  --f-body: "Noto Serif Bengali", "Tiro Bangla", Georgia, serif;
  --f-ui: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --w: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1815; --paper-2: #24211d; --ink: #ece5d7; --ink-2: #aaa092;
    --hair: #3d3831; --red: #e2584d; --up: #63c283; --down: #ef6d62; --sel: #5a4520;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1815; --paper-2: #24211d; --ink: #ece5d7; --ink-2: #aaa092;
  --hair: #3d3831; --red: #e2584d; --up: #63c283; --down: #ef6d62; --sel: #5a4520;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.75; }
::selection { background: var(--sel); }
a { color: inherit; }
a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.wrap { max-width: var(--w); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 400; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }

/* Masthead */
.topline { font-family: var(--f-ui); font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; justify-content: space-between; padding-block: 12px 8px; border-bottom: 1px solid var(--hair); }
.topline .grp { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.live { color: var(--red); font-weight: 600; }
.theme-btn { background: none; border: 1px solid var(--hair); color: var(--ink); border-radius: 2px; padding: 2px 10px; font-family: var(--f-ui); font-size: 13px; }
.mast { text-align: center; padding-block: 18px 10px; }
.mast h1 { font-family: var(--f-mast); font-size: clamp(48px, 10vw, 104px); line-height: 1.05; letter-spacing: -0.01em; }
.mast .tag { font-family: var(--f-ui); font-size: 14px; letter-spacing: 0.06em; color: var(--ink-2); margin-top: 6px; }
.dbl { border: 0; border-top: 3px double var(--ink); margin: 0; }

/* Section nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px 22px; overflow-x: auto; scrollbar-width: none; font-family: var(--f-ui); font-size: 15px; font-weight: 500; }
.nav a { display: block; padding-block: 8px; text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; }
.nav a:hover { border-bottom-color: var(--red); }

/* Market strip */
.market { border-bottom: 1px solid var(--hair); }
.market .row { display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; }
.mk { flex: 1 0 auto; min-width: 128px; padding: 10px 14px; border-right: 1px solid var(--hair); font-family: var(--f-ui); }
.mk:first-child { padding-left: 0; }
.mk:last-child { border-right: 0; }
.mk .n { font-size: 12px; color: var(--ink-2); letter-spacing: 0.03em; }
.mk .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.mk .c { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mk .c.up { color: var(--up); } .mk .c.down { color: var(--down); } .mk .c.flat { color: var(--ink-2); }
.market .asof { font-family: var(--f-ui); font-size: 12px; color: var(--ink-2); padding-block: 0 8px; }

/* Labels */
.kicker { font-family: var(--f-ui); font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--red); text-transform: uppercase; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 3px double var(--ink); padding-top: 10px; margin-bottom: 18px; }
.sec-head h2 { font-family: var(--f-mast); font-size: 30px; line-height: 1.2; }
.sec-head .meta { font-family: var(--f-ui); font-size: 13px; color: var(--ink-2); }
section { scroll-margin-top: 56px; }

/* Front page grid */
.front { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); gap: 0 32px; padding-block: 26px 10px; }
.front > * { min-width: 0; }
.side { border-left: 1px solid var(--hair); padding-left: 28px; display: flex; flex-direction: column; gap: 26px; }

.lead h3 { font-family: var(--f-mast); font-size: clamp(28px, 4vw, 42px); line-height: 1.2; margin-block: 6px 12px; }
.lead .sum { font-size: 18.5px; }
.story .sum { font-size: 16px; color: var(--ink); }
.why { margin-top: 12px; padding: 10px 14px; background: var(--paper-2); border-left: 3px solid var(--red); font-family: var(--f-ui); font-size: 14.5px; line-height: 1.6; }
.why b { color: var(--red); font-weight: 600; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; font-family: var(--f-ui); font-size: 13px; color: var(--ink-2); }
.foot a { color: var(--ink-2); }
.save { background: none; border: 1px solid var(--hair); color: var(--ink); border-radius: 2px; padding: 1px 10px; font-family: var(--f-ui); font-size: 13px; }
.save[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.stories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin-top: 26px; border-top: 1px solid var(--ink); }
.story { padding-block: 16px; border-bottom: 1px solid var(--hair); min-width: 0; }
.story h3 { font-family: var(--f-mast); font-size: 22px; line-height: 1.3; margin-block: 4px 8px; }

/* Side boxes */
.box h3 { font-family: var(--f-mast); font-size: 34px; line-height: 1.15; margin-block: 4px 2px; }
.box .bn { font-family: var(--f-ui); color: var(--ink-2); font-size: 14px; margin-bottom: 8px; }
.box p + p { margin-top: 10px; }
.formula { font-family: var(--f-ui); font-variant-numeric: tabular-nums; background: var(--paper-2); padding: 6px 10px; margin-top: 10px; font-size: 14.5px; overflow-x: auto; }
.tip { font-family: var(--f-ui); font-size: 14px; color: var(--ink-2); font-style: normal; border-top: 1px dashed var(--hair); padding-top: 8px; margin-top: 10px; }
.gd h3 { font-size: 23px; line-height: 1.35; }
.gd .ctx { font-size: 15px; color: var(--ink-2); margin-bottom: 10px; }
.gd h4 { font-family: var(--f-ui); font-size: 14px; font-weight: 600; margin-top: 10px; }
.gd h4.f { color: var(--up); } .gd h4.a { color: var(--down); }
.gd ul { margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.6; }
.gd li + li { margin-top: 4px; }

/* Blog */
.blog { padding-block: 34px 10px; }
.blog-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; }
.blog-grid > * { min-width: 0; }
.blog h2.t { font-family: var(--f-mast); font-size: clamp(30px, 4.5vw, 46px); line-height: 1.2; margin-block: 6px 6px; }
.blog .by { font-family: var(--f-ui); font-size: 13.5px; color: var(--ink-2); margin-bottom: 18px; }
.prose { max-width: 66ch; }
.prose p { margin-bottom: 1em; }
.prose p.first::first-letter { font-family: var(--f-mast); float: left; font-size: 3.6em; line-height: 0.9; padding: 6px 10px 0 0; color: var(--red); }
.prose h4 { font-family: var(--f-mast); font-size: 22px; margin-block: 1.3em 0.4em; }
.takeaways { border: 1px solid var(--ink); padding: 14px 16px; font-family: var(--f-ui); font-size: 14.5px; line-height: 1.6; }
.takeaways h4 { font-family: var(--f-ui); font-weight: 600; font-size: 14px; letter-spacing: 0.06em; margin-bottom: 8px; color: var(--red); }
.takeaways ol { margin: 0; padding-left: 20px; }
.takeaways li + li { margin-top: 8px; }
.suggest { margin-top: 20px; border-top: 3px double var(--ink); padding-top: 12px; font-family: var(--f-ui); }
.suggest h4 { font-family: var(--f-mast); font-size: 20px; font-weight: 400; }
.suggest p.s { font-size: 13.5px; color: var(--ink-2); margin-block: 4px 10px; line-height: 1.5; }
.suggest form { display: flex; gap: 8px; flex-wrap: wrap; }
.suggest input { flex: 1 1 160px; min-width: 0; font: inherit; font-size: 15px; padding: 6px 10px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink-2); border-radius: 2px; }
.btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 2px; padding: 6px 14px; font-family: var(--f-ui); font-size: 14.5px; font-weight: 500; }
.btn:disabled { opacity: 0.5; cursor: default; }
.msg { font-size: 13px; margin-top: 6px; color: var(--ink-2); min-height: 1.2em; }
.slist { list-style: none; padding: 0; margin: 12px 0 0; font-size: 14px; }
.slist li { padding-block: 6px; border-top: 1px solid var(--hair); display: flex; justify-content: space-between; gap: 8px; }
.slist .st { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.slist .st.used { color: var(--up); }

/* Quiz + Case */
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 32px; padding-block: 34px 10px; }
.duo > section { min-width: 0; }
.q { padding-block: 14px; border-bottom: 1px solid var(--hair); }
.q:first-of-type { padding-top: 0; }
.q .qt { font-weight: 600; font-size: 16.5px; margin-bottom: 8px; }
.q .qn { color: var(--red); font-family: var(--f-ui); margin-right: 6px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; background: var(--paper); color: var(--ink); border: 1px solid var(--hair); border-radius: 2px; padding: 6px 12px; font-family: var(--f-ui); font-size: 15px; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--up); color: var(--up); font-weight: 600; }
.opt.wrong { border-color: var(--down); color: var(--down); text-decoration: line-through; }
.exp { margin-top: 8px; font-family: var(--f-ui); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.score { font-family: var(--f-ui); font-size: 15px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.score b { font-variant-numeric: tabular-nums; font-size: 22px; }
.link-btn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--ink-2); font-family: var(--f-ui); font-size: 13.5px; }

.case h3 { font-family: var(--f-mast); font-size: 27px; line-height: 1.3; margin-block: 6px 10px; }
.case .intro { font-size: 16.5px; }
.case h4 { font-family: var(--f-ui); font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: var(--red); margin-top: 16px; margin-bottom: 2px; }
.case .p { font-size: 15.5px; }
.lesson { margin-top: 16px; border: 1px solid var(--ink); padding: 12px 14px; font-size: 15.5px; }
.lesson b { font-family: var(--f-ui); }
.think { margin-top: 10px; font-family: var(--f-ui); font-size: 14.5px; color: var(--ink-2); }

/* Notes + archive */
.duo2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0 32px; padding-block: 34px 10px; }
.duo2 > section { min-width: 0; }
.bm { list-style: none; padding: 0; margin: 0 0 18px; font-size: 15.5px; }
.bm li { padding-block: 8px; border-bottom: 1px solid var(--hair); display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
.bm .d { font-family: var(--f-ui); font-size: 12px; color: var(--ink-2); display: block; }
.bm a { text-decoration: none; }
.bm a:hover { text-decoration: underline; }
.empty { font-family: var(--f-ui); font-size: 14.5px; color: var(--ink-2); padding-block: 8px; }
label.l { display: block; font-family: var(--f-ui); font-weight: 600; font-size: 14px; margin-bottom: 6px; }
textarea { width: 100%; min-height: 150px; resize: vertical; font: inherit; font-size: 16px; line-height: 1.7; padding: 10px 12px; color: var(--ink); border: 1px solid var(--ink-2); border-radius: 2px;
  background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.7em - 1px), var(--hair) calc(1.7em - 1px), var(--hair) 1.7em); background-attachment: local; background-position: 0 10px; }
.saved-note { font-family: var(--f-ui); font-size: 12.5px; color: var(--ink-2); margin-top: 4px; min-height: 1.2em; }
.arch { list-style: none; padding: 0; margin: 0; }
.arch li { border-bottom: 1px solid var(--hair); }
.arch button { width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 10px 0; display: grid; gap: 2px; }
.arch .d { font-family: var(--f-ui); font-size: 13px; color: var(--red); font-weight: 600; }
.arch .h { font-family: var(--f-mast); font-size: 18px; line-height: 1.35; }
.arch button[aria-current="true"] .h { text-decoration: underline; text-decoration-color: var(--red); }

.banner { font-family: var(--f-ui); font-size: 14px; background: var(--paper-2); border: 1px solid var(--hair); padding: 8px 12px; margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

footer { margin-top: 40px; border-top: 3px double var(--ink); padding-block: 14px 30px; font-family: var(--f-ui); font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; }

.loading { padding-block: 60px; text-align: center; font-family: var(--f-ui); color: var(--ink-2); }

/* Share menu */
.share-wrap { position: relative; display: inline-block; }
.share-menu { position: absolute; z-index: 6; left: 0; top: calc(100% + 4px); min-width: 190px; background: var(--paper); border: 1px solid var(--ink); padding: 6px; display: grid; gap: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.12); font-family: var(--f-ui); font-size: 14px; }
.share-menu a, .share-menu button { display: block; text-align: left; background: none; border: 0; color: var(--ink); padding: 6px 8px; text-decoration: none; font-family: var(--f-ui); font-size: 14px; }
.share-menu a:hover, .share-menu button:hover { background: var(--paper-2); }
.share-menu .msg { margin: 0; padding: 0 8px; }
.story.flash, .lead.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: var(--sel); } 100% { background: transparent; } }

/* Ask AI */
.ask { margin-top: 10px; border: 1px solid var(--hair); background: var(--paper-2); padding: 10px 12px; font-family: var(--f-ui); font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { background: var(--paper); color: var(--ink); border: 1px solid var(--hair); border-radius: 999px; padding: 2px 12px; font-family: var(--f-ui); font-size: 13.5px; }
.chip:hover:not(:disabled) { border-color: var(--ink); }
.ask form { display: flex; gap: 8px; flex-wrap: wrap; }
.ask input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 5px 10px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink-2); border-radius: 2px; }
.ask .ans { margin-top: 10px; white-space: pre-wrap; line-height: 1.65; font-size: 15px; color: var(--ink); }
.ask .ans:empty { display: none; }
.ask .note { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

/* Quiz streak */
.streak { font-family: var(--f-ui); font-size: 14.5px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--hair); }
.dots { display: flex; gap: 5px; margin-top: 6px; list-style: none; padding: 0; flex-wrap: wrap; }
.dots li { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink-2); }
.dots li.on { background: var(--red); border-color: var(--red); }
.dots li.today { outline: 1px solid var(--ink); outline-offset: 2px; }
.weekly { margin-top: 30px; }
.weekly h3 { font-family: var(--f-mast); font-size: 23px; line-height: 1.35; margin-bottom: 8px; }
.weekly ul.sum5 { margin: 0 0 18px; padding-left: 20px; font-size: 15.5px; line-height: 1.6; }
.weekly ul.sum5 li + li { margin-top: 6px; }

/* Glossary */
.glossary { padding-block: 34px 10px; }
.g-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; font-family: var(--f-ui); font-size: 14px; }
.g-tools input, .arch-search { flex: 1 1 200px; min-width: 0; font: inherit; font-family: var(--f-ui); font-size: 15px; padding: 6px 10px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink-2); border-radius: 2px; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--ink); padding: 4px 12px; font-family: var(--f-ui); font-size: 14px; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.ghost { background: none; color: var(--ink); border: 1px solid var(--ink); border-radius: 2px; padding: 4px 12px; font-family: var(--f-ui); font-size: 14px; }
.g-prog { font-family: var(--f-ui); font-size: 14px; color: var(--ink-2); margin-bottom: 14px; }
.g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 0; align-items: start; }
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.flip { perspective: 1000px; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); display: block; width: 100%; }
.flip-in { display: block; }
.face { border: 1px solid var(--ink); background: var(--paper); padding: 14px 16px; min-height: 170px; display: flex; flex-direction: column; gap: 6px; }
.face.back { display: none; background: var(--paper-2); font-family: var(--f-ui); font-size: 14px; line-height: 1.55; }
.card.flipped .face.front { display: none; }
.card.flipped .face.back { display: flex; }
.card.anim .face { animation: flipIn .35s ease-out; }
@keyframes flipIn { from { transform: rotateY(90deg); } to { transform: none; } }
.face .tm { font-family: var(--f-mast); font-size: 26px; line-height: 1.2; }
.face .gl { font-family: var(--f-ui); font-size: 14px; color: var(--ink-2); }
.face .hint { margin-top: auto; font-family: var(--f-ui); font-size: 12px; color: var(--ink-2); }
.face .st { font-family: var(--f-ui); font-size: 12px; font-weight: 600; color: var(--up); }
.face b { font-weight: 600; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.card .acts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (prefers-reduced-motion: reduce) { .card.anim .face { animation: none; } }

/* Notes list + archive groups */
.notes-all-l { margin-top: 18px; }
.sub-note { margin-bottom: 8px; }
.notes-all { list-style: none; padding: 0; margin: 6px 0 10px; font-size: 15px; }
.notes-all li { border-bottom: 1px solid var(--hair); }
.notes-all button { width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 8px 0; display: grid; gap: 2px; font: inherit; }

  // ---------- tiny helpers ----------
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  }
  // replaceChildren that flattens nested arrays and skips null/false, like el()
  function put(node, ...kids) {
    node.replaceChildren(...kids.flat(Infinity).filter((c) => c != null && c !== false));
  }

  async function copyText(s) {
    try { await navigator.clipboard.writeText(s); return; } catch (e) {}
    const ta = el("textarea", { style: "position:fixed;top:0;left:0;opacity:0", "aria-hidden": "true" });
    ta.value = s; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    if (!ok) throw new Error("copy failed");

  async function doShare(wrap, btn, title, url) {

    const old = article.querySelector(".ask");
    if (old) { if (old._abort) old._abort(); old.remove(); btn.setAttribute("aria-expanded", "false"); return; }
    const ans = el("div", { class: "ans", "aria-live": "polite" });
    const status = el("div", { class: "msg", role: "status" });
    const input = el("input", { type: "text", maxlength: "300", placeholder: t("askPh"), "aria-label": t("askPh") });
    let ctl = null;
    async function ask(q) {
      q = (q || "").trim();
      if (!q) { status.textContent = t("askEmpty"); return; }
      if (!sampleFn) return;
      if (ctl) ctl.abort(); // one request at a time per panel
      const mine = ctl = new AbortController();
      ans.textContent = ""; status.textContent = t("askWait");
      try {
        const res = await sampleFn(askPrompt(n, q), {
          modelTier: "quick", signal: mine.signal,
          onText: ({ text }) => { if (mine === ctl) { ans.textContent = text; status.textContent = ""; } }
        });
        if (mine !== ctl) return;
        if (res && res.text) ans.textContent = res.text;
        status.textContent = "";
      } catch (e) {
        if (mine !== ctl) return;
        const code = e && e.code;
        if (code === "cancelled") status.textContent = "";
        else if (code === "not_granted") disableAsk();
        else {
          status.textContent = code === "rate_limited" ? t("askRate") : t("askFail");
          if (e && e.text) ans.textContent = e.text;
        }
      } finally { if (mine === ctl) ctl = null; }
    }
    const panel = el("div", { class: "ask" },
      el("div", { class: "chips" }, t("askChips").map((c) => el("button", { class: "chip", type: "button", onclick: () => ask(c) }, c))),

  // One quiz: questions, instant answers, score. Answers are kept per device under `key`.
  // onDone(right, total, onLoad) runs when every question has an answer.
  function quizBlock(box, quiz, key, onDone) {
    const picks = ls.get(key, {});
    box.replaceChildren();
    const scoreLine = el("div", { class: "score" });
    const rightCount = () => quiz.reduce((a, q, i) => a + (picks[i] === q.answer ? 1 : 0), 0);
    function paintScore() {
      const done = Object.keys(picks).length;
      const right = rightCount();
      put(scoreLine, 
        el("span", null, t("yourScore")),
        el("b", null, num(right) + " / " + num(quiz.length)),
        el("span", { class: "exp" }, done < quiz.length ? t("left")(num(quiz.length - done)) : (right === quiz.length ? t("allRight") : t("goodTry"))),
        done ? el("button", { class: "link-btn", type: "button", onclick: () => { for (const k in picks) delete picks[k]; ls.set(key, picks); quizBlock(box, quiz, key, onDone); } }, t("again")) : null);
    }
    quiz.forEach((q, i) => {
      const opts = el("div", { class: "opts" });
      const exp = el("div", { class: "exp", hidden: true }, q.explain);
      const buttons = q.options.map((o, j) => el("button", {
        class: "opt", type: "button",
        onclick: () => {
          picks[i] = j; ls.set(key, picks); paint(); paintScore();
          if (Object.keys(picks).length === quiz.length && onDone) onDone(rightCount(), quiz.length, false);
        }
      }, t("letters")[j] + ") " + o));
      function paint() {
        const p = picks[i];
        if (p == null) return;
        buttons.forEach((b, j) => {
          b.disabled = true;
          if (j === q.answer) b.classList.add("right");
          else if (j === p) b.classList.add("wrong");
        });
        exp.hidden = false;
      }
      opts.append(...buttons);
      box.append(el("div", { class: "q" }, el("div", { class: "qt" }, el("span", { class: "qn" }, num(i + 1) + "."), q.q), opts, exp));
      paint();
    });
    box.append(scoreLine);
    paintScore();
    if (quiz.length && Object.keys(picks).length >= quiz.length && onDone) onDone(rightCount(), quiz.length, true);
  }

  function quizStats() {
    const done = (d) => !!personal.quiz[d];
    const today = istToday(), yday = shiftDate(today, -1);
    let cur = 0;
    for (let d = done(today) ? today : (done(yday) ? yday : null); d && done(d); d = shiftDate(d, -1)) cur++;
    const dates = Object.keys(personal.quiz).sort();
    let best = 0, run = 0, prev = null;
    for (const d of dates) { run = prev && shiftDate(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
    const total = dates.reduce((a, d) => a + (Number(personal.quiz[d].right) || 0), 0);
    return { cur, best, total, today };
  }

  async function migrateQuiz() {
    const todo = [];

      for (let i = 0; i < localStorage.length; i++) {
        const m = /^bba-quiz-(\d{4}-\d{2}-\d{2})$/.exec(localStorage.key(i) || "");

    else {
      const bn = day.news.find((x) => x.id === n.id) || n;
      const en = day.en && day.en.news ? day.en.news.find((x) => x.id === n.id) : null;
      personal.bookmarks = personal.bookmarks.concat({
        date: day.date, label: day.dateLabel, labelEn: day.en ? day.en.dateLabel : null,
        id: n.id, title: bn.title, titleEn: en ? en.title : null, url: n.source && n.source.url
      });
    }
    btn.setAttribute("aria-pressed", isSaved(n.id) ? "true" : "false");
    btn.textContent = isSaved(n.id) ? t("saved") : t("save");
    renderBookmarks(); persist();
  }
  function removeBookmark(b) {
    personal.bookmarks = personal.bookmarks.filter((x) => !(x.date === b.date && x.id === b.id));
    renderBookmarks(); renderNews(); persist();
  }
  function wireStatic() {
    const ta = $("noteArea");
    ta.addEventListener("input", () => {
      $("noteSaved").textContent = t("writing");
      clearTimeout(saveTimer);
      const date = day.date;
      saveTimer = setTimeout(() => {
        if (ta.value.trim()) personal.notes[date] = ta.value; else delete personal.notes[date];
        renderNotesAll();
        persist().then(() => { $("noteSaved").textContent = t("noteSaved"); });
      }, 900);
    });
    $("suggestForm").addEventListener("submit", submitSuggestion);
    $("dlNotes").addEventListener("click", downloadNotes);
    $("archSearch").addEventListener("input", renderArchive);
    $("glossSearch").addEventListener("input", (e) => { gState.q = e.target.value; renderGlossary(); });
    $("gfAll").addEventListener("click", () => { gState.filter = "all"; renderGlossary(); });
    $("gfLearn").addEventListener("click", () => { gState.filter = "learn"; renderGlossary(); });
    $("glossShuffle").addEventListener("click", () => {
      const keys = (terms || []).map(termKey);
      for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
      gState.order = keys; renderGlossary();
    });
  }
  $("shareEdBtn").addEventListener("click", () => {
    if (!day) return;
    const lead = (C("news") || [])[0];
    doShare($("shareEdWrap"), $("shareEdBtn"), "Sandip's Board · " + dateLabel() + (lead ? " · " + lead.title : ""), shareUrl(day.date));
  });

  // ---------- email subscription (MailerLite, double opt-in) ----------
  function initSubscribe() {
    const action = CONFIG.SUBSCRIBE_ACTION || "";
    if (!/^https:\/\//.test(action) || action.includes("PASTE_")) return; // not set up yet: stay hidden
    $("subscribe").hidden = false; $("navSubLi").hidden = false;
    if (inClaude) {
      // inside claude.ai the page shouldn't post to other sites: send readers to the public page
      $("subForm").hidden = true; $("subClaude").hidden = false;
      $("subOpen").href = CONFIG.PUBLIC_URL + "#subscribe";
      return;
    }
    $("subForm").addEventListener("submit", submitSubscribe);
  }
  async function submitSubscribe(ev) {
    ev.preventDefault();
    const input = $("subEmail"), msg = $("subMsg"), btn = $("subBtn");
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      input.setAttribute("aria-invalid", "true"); msg.textContent = t("subBad"); input.focus(); return;
    }
    input.removeAttribute("aria-invalid");
    const fields = { "fields[email]": email, "ml-submit": "1", "anticsrf": "true" };
    const fd = new FormData();
    for (const k in fields) fd.append(k, fields[k]);
    btn.disabled = true; msg.textContent = t("subSending");
    try {
      const r = await fetch(CONFIG.SUBSCRIBE_ACTION, { method: "POST", body: fd });
      let j = null; try { j = await r.json(); } catch (e) {}
      if (r.ok && !(j && j.success === false)) { msg.textContent = t("subOk"); input.value = ""; }
      else msg.textContent = t("subFail");
    } catch (e) {
      // fetch was blocked: submit a real form in a new tab instead
      try {
        const f = el("form", { method: "POST", action: CONFIG.SUBSCRIBE_ACTION, target: "_blank", hidden: true },
          Object.keys(fields).map((k) => el("input", { type: "hidden", name: k, value: fields[k] })));
        document.body.append(f); f.submit(); f.remove();
        msg.textContent = t("subFallback"); input.value = "";
      } catch (e2) { msg.textContent = t("subFail"); }
    }
    btn.disabled = false;
  }

  // ---------- suggestions (shared) ----------
  let suggestionsStarted = false, suggestionDocs = [], sugMsgKey = null;
  function setSugMsg(k) { sugMsgKey = k; $("suggestMsg").textContent = k ? t(k) : ""; }
  function paintSuggestions() {
    if (!mounted) return;
    if (sugMsgKey) $("suggestMsg").textContent = t(sugMsgKey);
    const list = $("suggestList"); list.replaceChildren();
    const inp = $("suggestInput");
    inp.placeholder = t("sugPh");
    for (const d of suggestionDocs) {
      const v = d.data() || {};
      if (!v.topic) continue;
      if (d.id === uid) inp.placeholder = t("yourTopic") + v.topic;
      list.append(el("li", null, el("span", null, v.topic), el("span", { class: "st" + (v.status === "used" ? " used" : "") }, v.status === "used" ? t("stUsed") : t("stNew"))));
    }
  }
  function startSuggestions() {
    if (noRuntime) { hideSuggest(); return; }
    if (!db) { noDbSuggest(); return; }
    if (suggestionsStarted) return;
    suggestionsStarted = true;
    $("suggestBtn").disabled = false; $("suggestInput").disabled = false;
    if (sugMsgKey === "sugSignIn") setSugMsg(null);
    let gotData = false;
    const timer = setTimeout(() => { if (!gotData) setSugMsg("sugSlow"); }, 10000);
    db.collection("suggestions").orderBy("at", "desc").limit(20).onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { gotData = true; clearTimeout(timer); if (sugMsgKey === "sugSlow") setSugMsg(null); }
      suggestionDocs = snap.docs;
      paintSuggestions();
    }, () => { clearTimeout(timer); });
  }
  function noDbSuggest() {
    if (!mounted || connecting) return;
    $("suggestBtn").disabled = true;
    $("suggestInput").disabled = true;
    setSugMsg("sugSignIn");
  }
  async function submitSuggestion(ev) {
    ev.preventDefault();
    const inp = $("suggestInput");
    const topic = inp.value.trim();
    if (!topic) { setSugMsg("sugEmpty"); return; }
    if (!db || !uid) { noDbSuggest(); return; }
    $("suggestBtn").disabled = true;
    try {
      await db.doc("suggestions/" + uid).set({ topic: topic.slice(0, 120), at: new Date().toISOString(), status: "new" });
      inp.value = ""; setSugMsg("sugOk");
    } catch (e) {
      setSugMsg(e && e.code === "invalid_argument" ? "sugNoPerm" : "sugFail");
    }
    $("suggestBtn").disabled = false;
  }

  // ---------- capabilities ----------
  async function connect() {
    // Outside claude.ai (e.g. GitHub Pages) there is no shared database or AI: hide those features
    if (!inClaude) { connecting = false; noRuntime = true; hideSuggest(); return; }
    window.claude.use("sample").then((s) => {
      sampleFn = s || null;
      if (sampleFn) document.querySelectorAll(".ask-btn").forEach((b) => { b.hidden = false; });
    }).catch(() => {});
    try {
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      db = d;
      if (u) { try { uid = await u.id(); } catch (e) { uid = null; } }
      if (db && uid) {
        personalRef = db.doc("data/users/" + uid + "/personal");
        try {
          const s = await personalRef.get();
          const v = s.exists ? (s.data() || {}) : {};
          const account = { bookmarks: v.bookmarks || [], notes: v.notes || {}, quiz: v.quiz || {}, known: v.known || {} };
          // keep anything saved on this device that the account doesn't have yet
          const seen = new Set(account.bookmarks.map((b) => b.date + "|" + b.id));
          personal.bookmarks = account.bookmarks.concat(personal.bookmarks.filter((b) => !seen.has(b.date + "|" + b.id)));
          personal.notes = Object.assign({}, personal.notes, account.notes);
          personal.quiz = Object.assign({}, personal.quiz, account.quiz);
          personal.known = Object.assign({}, personal.known, account.known);
          if (JSON.stringify(personalDoc()) !== JSON.stringify(account)) persist();
        } catch (e) { personalRef = null; }
        if (mounted) {
          $("notesWhere").textContent = personalRef ? t("onlyYouSync") : t("onlyYou");
          renderBookmarks(); renderNote(); renderNews(); renderStreak(); renderGlossary(); renderNotesAll();
        }
      }
    } catch (e) {}
    connecting = false;
    if (mounted) startSuggestions();
  }

  // ---------- newsletter popup: opens once when the reader reaches 50% of the page ----------
  function initPopup() {
    const pop = $("nlp");
    const action = CONFIG.POPUP_ACTION || "";
    if (!pop || inClaude || !/^https:\/\//.test(action)) return; // never inside claude.ai
    const K_SUB = "nl-subscribed", K_DISMISS = "nl-dismissed-at", SNOOZE_MS = 7 * 864e5;
    if (ls.get(K_SUB, false)) return;
    if (Date.now() - Number(ls.get(K_DISMISS, 0)) < SNOOZE_MS) return;
    const form = $("nlpForm"), input = $("nlpEmail"), btn = $("nlpBtn"), msg = $("nlpMsg");
    let lastFocus = null;
    const isOpen = () => pop.classList.contains("open");
    function open() {
      window.removeEventListener("scroll", check);
      lastFocus = document.activeElement;
      pop.classList.add("open"); pop.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(() => input.focus({ preventScroll: true }), 80);
    }
    function close() {
      if (!isOpen()) return;
      pop.classList.remove("open"); pop.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if (!ls.get(K_SUB, false)) ls.set(K_DISMISS, Date.now());
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }
    function check() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (max > 0 && window.scrollY / max >= 0.5) open();
    }
    window.addEventListener("scroll", check, { passive: true });
    pop.querySelectorAll("[data-nlp-close]").forEach((n) => n.addEventListener("click", close));
    document.addEventListener("keydown", (e) => {
      if (!isOpen()) return;
      if (e.key === "Escape") close();
      if (e.key === "Tab") { // keep focus inside the popup
        const items = [...pop.querySelectorAll("button, input")].filter((n) => n.offsetParent !== null);
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    const say = (text, bad) => { msg.textContent = text; msg.classList.toggle("bad", !!bad); };
    say(t("nlpNote"));
    input.addEventListener("input", () => { if (msg.classList.contains("bad")) { input.removeAttribute("aria-invalid"); say(t("nlpNote")); } });
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (btn.getAttribute("aria-disabled") === "true") return;
      const email = input.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        input.setAttribute("aria-invalid", "true"); say(t("subBad"), true); input.focus(); return;
      }
      input.removeAttribute("aria-invalid");
      const fd = new FormData();
      fd.append("fields[email]", email); fd.append("ml-submit", "1"); fd.append("anticsrf", "true");
      btn.setAttribute("aria-disabled", "true"); say(t("subSending"));
      let ok = false, err = "";
      try {
        const r = await fetch(action, { method: "POST", body: fd });
        let j = null; try { j = await r.json(); } catch (e) {}
        ok = r.ok && !!(j && j.success);
        if (!ok) err = (j && j.errors && j.errors.fields && j.errors.fields.email && j.errors.fields.email[0]) || t("nlpFail");
      } catch (e) { err = t("nlpFail"); }
      btn.removeAttribute("aria-disabled");
      if (!ok) { say(err, true); return; }
      ls.set(K_SUB, true);
      $("nlpBody").hidden = true; $("nlpDone").hidden = false;
      $("nlpDone").querySelector("button").focus({ preventScroll: true });
    });
  }

  initSubscribe();
  initPopup();
  boot();
  connect();
})();
</script>
